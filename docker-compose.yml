services:
  # ===========================================================================
  # ReRout Controller - API 网关与路由编排
  # ===========================================================================
  controller:
    build:
      context: .
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      - HIGRESS_BASE_URL=${HIGRESS_BASE_URL:-http://localhost:8080/v1}
      - HIGRESS_API_KEY=${HIGRESS_API_KEY:-}
    volumes:
      - ./config.yaml:/app/config.yaml
    command: ["python", "-m", "controller.main"]
    depends_on:
      intent:
        condition: service_healthy
      complexity:
        condition: service_healthy
      guardrails:
        condition: service_healthy
      policy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\ntry:\n  urllib.request.urlopen('http://localhost:8084/health', timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY\n"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # LLM Classifier Sidecar - 外部 LLM 意图分类（可替代内置 intent 服务）
  # 切换方式：config.yaml 中将 intent_classifier URL 改为 http://llm-classifier:9000/classify
  # ===========================================================================
  llm-classifier:
    build:
      context: ./llm-classifier
    env_file:
      - .env
    environment:
      - LLM_CLASSIFIER_MODE=${LLM_CLASSIFIER_MODE:-mock}
      - LLM_CLASSIFIER_URL=${LLM_CLASSIFIER_URL:-}
      - LLM_CLASSIFIER_MODEL=${LLM_CLASSIFIER_MODEL:-qwen2.5-7b}
      - LLM_CLASSIFIER_API_KEY=${LLM_CLASSIFIER_API_KEY:-}
      - LLM_CLASSIFIER_TIMEOUT=${LLM_CLASSIFIER_TIMEOUT:-10}
      - LLM_CLASSIFIER_LABELS=${LLM_CLASSIFIER_LABELS:-code_generation,reasoning,summarization,brainstorming,open_qa,chatbot}
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\ntry:\n  urllib.request.urlopen('http://localhost:9000/health', timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY\n"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # Intent Classifier - 内置意图分类（规则匹配 / ONNX）
  # ===========================================================================
  intent:
    build:
      context: .
    env_file:
      - .env
    environment:
      - INTENT_ONNX_PATH=${INTENT_ONNX_PATH:-/app/intent_onnx/model.onnx}
      - INTENT_TOKENIZER=${INTENT_TOKENIZER:-distilbert-base-uncased}
    volumes:
      - ./intent_onnx:/app/intent_onnx
    command: ["python", "classifiers/intent/app.py"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\ntry:\n  urllib.request.urlopen('http://localhost:8000/metrics', timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY\n"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # Complexity Estimator - 复杂度评估
  # ===========================================================================
  complexity:
    build:
      context: .
    env_file:
      - .env
    environment:
      - COMPLEXITY_ONNX_PATH=${COMPLEXITY_ONNX_PATH:-/app/complexity_onnx/model.onnx}
    volumes:
      - ./complexity_onnx:/app/complexity_onnx
    command: ["python", "classifiers/complexity/app.py"]
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\ntry:\n  urllib.request.urlopen('http://localhost:8001/metrics', timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY\n"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # Guardrails - 安全护栏（PII 检测）
  # ===========================================================================
  guardrails:
    build:
      context: .
    command: ["python", "guardrails/app.py"]
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,json,sys\ntry:\n  req = urllib.request.Request('http://localhost:8002/check', data=json.dumps({\"text\":\"test\"}).encode(), headers={'Content-Type': 'application/json'})\n  urllib.request.urlopen(req, timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY\n"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # Policy Engine - 模型选择策略
  # ===========================================================================
  policy:
    build:
      context: .
    env_file:
      - .env
    environment:
      - POLICY_MODEL_MAP=${POLICY_MODEL_MAP:-}
      - AB_ENABLED=${AB_ENABLED:-false}
      - BANDIT_EPSILON=${BANDIT_EPSILON:-0.1}
    command: ["python", "policy_engine/app.py"]
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\ntry:\n  urllib.request.urlopen('http://localhost:8003/metrics', timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY\n"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # Monitoring - Prometheus + Grafana
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false

  # ===========================================================================
  # Redis - 对话记忆存储（可选）
  # ===========================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  prometheus-data:
  grafana-data:
  redis-data:
